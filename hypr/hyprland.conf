# Hyprland Main Configuration File
# Organized into modular configuration files
# See https://wiki.hyprland.org/Configuring/Configuring-Hyprland/

$hypr = ~/.config/hypr
$hl = $hypr/hyprland

# Environment variables
source = $hypr/env_var.conf

# Color scheme setup
exec = cp -L --no-preserve=mode --update=none $hypr/scheme/default.conf $hypr/scheme/current.conf
source = $hypr/scheme/current.conf

# Source modular configuration files
source = $hypr/input.conf
source = $hypr/autostart.conf
source = $hypr/appearance.conf
source = $hypr/layouts.conf
source = $hypr/windowrules.conf
source = $hypr/keybinds.conf

monitor=eDP-1,3072x1920@120.00,64x1184,2.00,vrr,1
monitor=DP-2,1920x1080@60.00,32x64,1.00
