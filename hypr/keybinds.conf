# Keybindings
# See https://wiki.hyprland.org/Configuring/Binds/

$mainMod = SUPER

# Application launchers
bind = $mainMod, R, exec, kitty -e tmux -u
bind = SuperShift, R, exec, kitty
bind = $mainMod, E, exec, kitty --class=floatingTerm -e yazi
bind = $mainMod, W, exec, kitty -e ~/.config/sesh/sesh.sh
bind = $mainMod, C, exec, QT_QPA_PLATFORM=wayland QT_SCALE_FACTOR=1 qalculate-qt
bind = $mainMod, B, exec, kitty --class=floatingTerm -e bluetui
bind = $mainMod, z, exec, kitty --class=floatingTerm -e wifitui
bind = $mainMod, m, exec, kitty --class=floatingTerm -e pulsemixer

# Window management
bind = $mainMod, Q, killactive,
bind = $mainMod, G, fullscreen,
bind = $mainMod, F, togglefloating,
bind = SuperShift, V, togglesplit,

# System controls
# bind = $mainMod ALT, L, exec, 1password --lock ; hyprlock
bind = $mainMod, X, exec, wlogout --protocol layer-shell
# bind = SuperShift, M, exit,
bind = SuperShift, B, exec, killall waybar; waybar

# Utilities
bind = $mainMod, P, exec, 1password --quick-access
bind = SuperShift, C, exec, hyprpicker | wl-copy
# bind = SuperShift, S, exec, grim -g "$(slurp)" - | swappy -f -
bind = Super, V, exec, pkill fuzzel || caelestia clipboard
bind = Super+Alt, V, exec, pkill fuzzel || caelestia clipboard -d
bind = Ctrl+Super, E, exec, pkill fuzzel || caelestia emoji -p

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Swap windows
bind = SuperShift, H, movewindow, l
bind = SuperShift, L, movewindow, r
bind = SuperShift, K, movewindow, u
bind = SuperShift, j, movewindow, d

# Window split ratio
binde = Super, Minus, splitratio, -0.1
binde = Super, Equal, splitratio, 0.1
binde = Super, Semicolon, splitratio, -0.1
binde = Super, Apostrophe, splitratio, 0.1

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = SuperShift, 1, movetoworkspace, 1
bind = SuperShift, 2, movetoworkspace, 2
bind = SuperShift, 3, movetoworkspace, 3
bind = SuperShift, 4, movetoworkspace, 4
bind = SuperShift, 5, movetoworkspace, 5
bind = SuperShift, 6, movetoworkspacesilent, 6
bind = SuperShift, 7, movetoworkspacesilent, 7
bind = SuperShift, 8, movetoworkspacesilent, 8
bind = SuperShift, 9, movetoworkspace, 9
bind = SuperShift, 0, movetoworkspace, 10

# Caelestia global binds
bind = Ctrl+Super, R, global, caelestia:showall
bind = Ctrl+Super, L, global, caelestia:lock
bind = SuperShift, S, global, caelestia:screenshotFreeze
bind = Super, S, global, caelestia:screenshotClipboard
bind = Super, T, global, caelestia:dashboard
bind = Super, SPACE, global, caelestia:launcher
bind = Super, O, global, caelestia:clearNotifs
bindl = Ctrl+Super, Space, global, caelestia:mediaToggle

# Special workspace toggles
bind = super, A, exec, caelestia toggle sysmon
bind = super, N, exec, caelestia toggle todo

# Brightness
bindl = , XF86MonBrightnessUp, global, caelestia:brightnessUp
bindl = , XF86MonBrightnessDown, global, caelestia:brightnessDown

# Volume
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindle = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindle = , XF86AudioLowerVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%-

# Test notification
bindl = Ctrl+Super, f12, exec, notify-send -u low -i dialog-information-symbolic 'Test notification' "Here's a really long message to test truncation and wrapping\nYou can middle click or flick this notification to dismiss it!" -a 'Shell' -A "Test1=I got it!" -A "Test2=Another action"

# Mouse controls
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
