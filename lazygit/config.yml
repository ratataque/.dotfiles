gui:
    theme:
        selectedLineBgColor: ["#2229C4", "bold"]
        cherryPickedCommitBgColor: ["#2229C4", "bold"]
git:
    pagers:
        - colorArg: always
          pager: delta --dark --paging=never
customCommands:
    - key: "D"
      context: "files"
      command: 'printf ''%s'' {{.SelectedFile.Name | quote}} > /tmp/nvim_diffview_target && nvim --server "$NVIM" --remote-expr "v:lua.DiffviewFromLazygit()"'
      description: "Open file diff in Diffview (nvim)"
      output: none
